<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <!-- Neon Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft Glowing Base Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="6" />

  <!-- Decorative Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#shieldGrad)" stroke-dasharray="10 15" stroke-width="2" opacity="0.6"/>

  <g filter="url(#neonGlow)">
    <!-- Shield Icon -->
    <path d="M256 70 L390 120 V250 C390 350 256 425 256 425 C256 425 122 350 122 250 V120 Z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- Steering Wheel inside Shield -->
    <!-- Outer Rim -->
    <circle cx="256" cy="240" r="65" fill="none" stroke="url(#shieldGrad)" stroke-width="10" />
    <circle cx="256" cy="240" r="50" fill="none" stroke="url(#shieldGrad)" stroke-width="2" opacity="0.5" />
    
    <!-- Center Hub -->
    <circle cx="256" cy="240" r="16" fill="url(#shieldGrad)" />
    
    <!-- Spokes -->
    <!-- Left Spoke -->
    <path d="M191 240 L240 240" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Right Spoke -->
    <path d="M272 240 L321 240" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Bottom Spoke -->
    <path d="M256 256 L256 305" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Gavel / Scale elements - Balanced Justice Scales -->
    <path d="M190 150 H322" stroke="url(#shieldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M256 135 V150" stroke="url(#shieldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Scale pans hanging down -->
    <!-- Left scale pan -->
    <path d="M190 150 L175 190 H205 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right scale pan -->
    <path d="M322 150 L307 190 H337 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>